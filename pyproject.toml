[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "news-topic-classifier"
version = "1.0.0"
description = "News topic classification with a text baseline and pretrained sentence embeddings"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
  "onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "requests>=2.32,<3",
  "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "matplotlib>=3.9,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
news-prepare = "news_topics.prepare:main"
news-train = "news_topics.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
news_topics = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

